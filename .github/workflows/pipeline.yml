name: Mise à jour des actus

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 minutes (heure UTC)
  workflow_dispatch: {}       # bouton "Run workflow" pour lancer à la main

jobs:
  pipeline:
    # Ne tourne tout seul qu'une fois la variable PIPELINE_ENABLED mise à "true"
    # (Settings > Secrets and variables > Actions > Variables). Le lancement manuel marche toujours.
    if: ${{ vars.PIPELINE_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pipeline
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: claude-haiku-4-5
          PIPELINE_DEFAULT_STATUS: draft
